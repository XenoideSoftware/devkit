# Xenoide devkit global Conan configuration.
#
# This file is installed into every consumer's repo-local CONAN_HOME by
# `mise run setup` (conan config install .devkit/conan). It is a Jinja
# template: Conan renders it with access to `platform`, `os`,
# `conan_home_folder`, `detect_api` and `hashlib`.

{% set user_home = os.path.expanduser("~") %}
{% set download_cache = user_home ~ "/.xenoide/conan-download-cache" %}

# Share downloaded sources between every repo-local Conan cache so that
# `conan install` does not download zlib/libpng/qt/... once per repository.
core.download:download_cache={{ download_cache }}

# Keep the cache tidy: do not leave stale source folders around forever.
core.cache:storage_path={{ conan_home_folder }}/p

# Make non-interactive runs fail instead of blocking on a prompt (CI and
# devcontainers).
core:non_interactive=True
